<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLumina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E2E" />
      <stop offset="100%" stop-color="#090518" />
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5835E5" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="800" height="520" rx="20" fill="url(#bgLumina)" />
  <circle cx="650" cy="120" r="140" fill="#5835E5" opacity="0.35" filter="url(#blurGlow)" />
  <circle cx="150" cy="400" r="160" fill="#7C3AED" opacity="0.25" filter="url(#blurGlow)" />

  <!-- App Window Container -->
  <g transform="translate(60, 50)">
    <rect width="680" height="420" rx="16" fill="#1C1836" stroke="#37306B" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="680" height="42" rx="16" fill="#15112B" />
    <circle cx="28" cy="21" r="5" fill="#EF4444" />
    <circle cx="44" cy="21" r="5" fill="#F59E0B" />
    <circle cx="60" cy="21" r="5" fill="#10B981" />
    <rect x="250" y="12" width="180" height="18" rx="9" fill="#241E47" />
    <text x="340" y="25" fill="#A5B4FC" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">lumina-agent.ai/canvas</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="160" height="378" fill="#120E26" />
    <rect x="20" y="65" width="120" height="12" rx="4" fill="#3B3566" />
    <rect x="20" y="95" width="90" height="10" rx="3" fill="#262145" />
    <rect x="20" y="115" width="105" height="10" rx="3" fill="#262145" />
    <rect x="20" y="135" width="80" height="10" rx="3" fill="#262145" />
    <rect x="20" y="170" width="120" height="32" rx="8" fill="url(#violetGlow)" />
    <text x="80" y="190" fill="#FFFFFF" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">+ New Canvas</text>

    <!-- Canvas Nodes -->
    <g transform="translate(190, 70)">
      <!-- Node 1 -->
      <rect x="20" y="30" width="180" height="100" rx="12" fill="#201A42" stroke="#5835E5" stroke-width="1.5" />
      <rect x="36" y="46" width="60" height="16" rx="4" fill="#5835E5" />
      <text x="66" y="58" fill="#FFFFFF" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Agent Core</text>
      <rect x="36" y="74" width="140" height="8" rx="2" fill="#4B447A" />
      <rect x="36" y="90" width="100" height="8" rx="2" fill="#36305C" />

      <!-- Connector line -->
      <path d="M 200 80 C 240 80, 240 160, 270 160" stroke="#8C64FF" stroke-width="2" stroke-dasharray="4 4" />

      <!-- Node 2 (Prompt Engine) -->
      <rect x="270" y="110" width="190" height="120" rx="12" fill="#1F1940" stroke="#3B3469" stroke-width="1.5" />
      <rect x="286" y="126" width="75" height="16" rx="4" fill="#3B3469" />
      <text x="323.5" y="138" fill="#C4B5FD" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Neural Synthesis</text>
      <circle cx="430" cy="134" r="5" fill="#10B981" />
      
      <!-- Mini Chart in node -->
      <path d="M 290 190 Q 320 160 350 180 T 430 150" stroke="#10B981" stroke-width="2" fill="none" />
      <rect x="290" y="205" width="150" height="6" rx="2" fill="#383060" />

      <!-- Bottom Floating Prompt Bar -->
      <rect x="40" y="270" width="400" height="48" rx="24" fill="#15112B" stroke="#5835E5" stroke-width="1.5" />
      <circle cx="68" cy="294" r="12" fill="#5835E5" />
      <text x="68" y="298" fill="#FFFFFF" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">✦</text>
      <text x="96" y="299" fill="#D1D5DB" font-size="12" font-family="system-ui, sans-serif">Synthesize design tokens into React theme...</text>
      <rect x="380" y="280" width="50" height="28" rx="14" fill="#5835E5" />
      <text x="405" y="298" fill="#FFFFFF" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Run ↵</text>
    </g>
  </g>
</svg>
