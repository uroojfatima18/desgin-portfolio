  <rect width="800" height="520" rx="20" fill="url(#bgStrata)" />

  <!-- Grid overlay -->
  <path d="M 50 100 H 750 M 50 180 H 750 M 50 260 H 750 M 50 340 H 750 M 50 420 H 750" stroke="#27272A" stroke-width="0.8" stroke-dasharray="2 4" />
  
