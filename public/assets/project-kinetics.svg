<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgKinetics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041F1A" />
      <stop offset="100%" stop-color="#021410" />
    </linearGradient>
    <linearGradient id="emeraldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="20" fill="url(#bgKinetics)" />

  <g transform="translate(60, 50)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#064E3B" />
    <text x="70" y="18" fill="#6EE7B7" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">KINETICS ROBOTICS 3D</text>

    <!-- 3D Arm / HUD Telemetry Wireframe -->
    <g transform="translate(100, 50)">
      <!-- Isometric geometric construct -->
      <polygon points="240,60 380,120 380,240 240,180" fill="#065F46" opacity="0.6" stroke="#10B981" stroke-width="1.5" />
      <polygon points="100,120 240,60 240,180 100,240" fill="#047857" opacity="0.4" stroke="#10B981" stroke-width="1.5" />
      <polygon points="100,240 240,180 380,240 240,300" fill="#022C22" opacity="0.8" stroke="#34D399" stroke-width="1.5" />
      
      <!-- Telemetry Targets -->
      <circle cx="240" cy="180" r="28" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" fill="none" />
      <circle cx="240" cy="180" r="6" fill="#6EE7B7" />

      <!-- Coordinate HUD tags -->
      <line x1="268" y1="180" x2="350" y2="180" stroke="#34D399" stroke-width="1" />
      <rect x="350" y="165" width="120" height="30" rx="6" fill="#022C22" stroke="#059669" />
      <text x="360" y="184" fill="#A7F3D0" font-size="10" font-family="monospace">AXIS-Z: +104.2°</text>

      <line x1="212" y1="180" x2="130" y2="180" stroke="#34D399" stroke-width="1" />
      <rect x="10" y="165" width="120" height="30" rx="6" fill="#022C22" stroke="#059669" />
      <text x="20" y="184" fill="#A7F3D0" font-size="10" font-family="monospace">TORQUE: 420 Nm</text>

      <!-- Bottom Status Pill -->
      <rect x="140" y="320" width="200" height="36" rx="18" fill="url(#emeraldBeam)" />
      <text x="240" y="343" fill="#FFFFFF" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Interactive 3D Demo</text>
    </g>
  </g>
</svg>
